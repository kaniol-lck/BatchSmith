# BatchSmith 示例预设 —— 番剧重命名
#
# 在界面上打开：菜单「文件 → 打开预设…」（Ctrl+O），然后把文件夹拖到 list1 那一列上。
# 或者启动时直接带上它：
#   batchsmith presets/example-rename.toml
#
# 注意：预设里**不存绝对路径**。文件夹路径是运行时槽位（技术方案 ADR-7），
# 本机绑定的实际路径存在同目录的 example-rename.local.toml 里 ——
# 于是这个文件可以安全地分享、进版本控制，也不会泄漏本机目录结构。

[preset]
name = "番剧重命名"
version = 1

# 仅作来源标记与首次加载警示，不改变执行路径（技术方案 ADR-5）。
# safe | advanced
level = "safe"

# ---------------------------------------------------------------------------
# 列表。id 就是表达式里能引用的名字（list1、list2…）。
# ---------------------------------------------------------------------------

[[lists]]
id = "list1"
# 绑定文件夹：读取那一刻把 (行号 -> 绝对路径) 快照进 Plan，
# 绝不按序号回查目录（技术方案 §4.4）。
#
# ${input} 是运行时槽位：界面上把文件夹拖到这一列就会自动绑好；
# 命令行用 --bind input="D:/动画/某番"。
# 条目固定按自然序排列（第2话 在 第10话 之前），没有其它排序可选 ——
# 写 sort = "mtime" 之类会明确报错。
source = { kind = "dir", path = "${input}", filter = "*.mkv", recursive = false }
# 行数不一致时的缺省方式：empty 留空 | ignore 截断其他列表 | repeat 从头重复
fill = "empty"

[[lists]]
id = "list2"
# 手输列表：不写 source 就是手输，items 就是内容。
#
# 规划里还有 expr（表达式生成）/ snapshot（一次性读取）/ 生成器（seq、rand…）
# 这些来源都还没实现 —— 写了会明确报错，不会静默忽略。
items = ["第01话", "第02话", "第03话", "第04话"]
fill = "empty"

# ---------------------------------------------------------------------------
# 输出
# ---------------------------------------------------------------------------

[output]
# rename = 内置重命名（模板直接给出目标名，不经 shell，最安全）
# argv / stdout 属于后续阶段，现在写会报「还不支持」。
mode = "rename"

# 表达式：$...$ 内是 Lua，包裹外是普通字符串。
# i 是当前行号，rows 是批次总行数，list1[i] 取当前行的值。
# 工具函数见「帮助 → DSL 语法与函数速查」（F1）。
template = "$stem(list1[i])$ $list2[i]$.mkv"
