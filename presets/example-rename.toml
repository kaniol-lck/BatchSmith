# BatchSmith 示例预设 —— 番剧重命名
#
# 用法（M2 起可用）：
#   bs plan presets/example-rename.toml --bind input="D:/动画/某番"
#   bs run  presets/example-rename.toml --bind input="D:/动画/某番" --apply
#
# 注意：预设里**不存绝对路径**。路径是运行时由 --bind 提供的槽位（技术方案 ADR-7），
# 这样预设本身可以安全地分享、进版本控制，也不会泄漏本机目录结构。

[preset]
name = "番剧重命名"
version = 1

# 仅作来源标记与首次加载警示，不改变执行路径（技术方案 ADR-5）。
# safe | advanced
level = "safe"

# ---------------------------------------------------------------------------
# 列表。id 就是表达式里能引用的名字，所以别用 list1/list2 之外的怪名字。
# ---------------------------------------------------------------------------

[[lists]]
id = "list1"
# 绑定文件夹：读取那一刻把 (行号 -> 绝对路径) 快照进 Plan，
# 绝不按序号回查目录（技术方案 §4.4）
source = { kind = "dir", path = "${input}", filter = "*.mkv", recursive = false, sort = "natural" }
fill = "empty"

[[lists]]
id = "list2"
# 快照读取：一次性读入，之后与普通手输列表无异，不受目录变动影响
source = { kind = "snapshot", path = "titles.txt" }
# 行数不一致时的缺省方式：empty 留空 | ignore 截断其他列表 | repeat 从头重复
fill = "empty"

# ---------------------------------------------------------------------------
# 输出
# ---------------------------------------------------------------------------

[output]
# rename = 内置重命名（模板直接给出目标名，不经 shell，最安全）
# argv   = 外部命令（模板分词成 argv 数组，仍然不经 shell）
# stdout = 只输出文本
mode = "rename"

# 表达式：$...$ 内是 Lua，包裹外是普通字符串。
# i 是当前行号，rows 是批次总行数，list1[i] 取当前行的值。
template = "$stem(list1[i])$ $list2[i]$.mkv"

# ---------------------------------------------------------------------------
# 执行
# ---------------------------------------------------------------------------

[exec]
# 并行度；重命名因涉及临时名交换，实际会退化为串行
jobs = 4
# 默认 dry-run。这里保持 true，真正执行请在命令行加 --apply。
dry_run = true
