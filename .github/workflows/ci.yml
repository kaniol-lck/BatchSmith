name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 发版需要创建 Release；其余步骤只读
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # tag 构建不允许被后来的推送取消，否则会发出不完整的 Release
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  QT_VERSION: '6.7.2'

jobs:
  # =========================================================================
  # 构建 + 测试 + 打包（三平台）
  # =========================================================================
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            # ⚠ 必须用 msvc2019_64：Qt 6.7.2 的 Windows 包只有
            #   win64_msvc2019_64 / win64_msvc2019_arm64 / win64_mingw / win64_llvm_mingw，
            #   **不存在 msvc2022_64**（该后缀到 Qt 6.8 才出现）。
            #   写错的话 install-qt-action 会在下载前就失败，与代码无关。
            #   msvc2019_64 的二进制与 VS2022 是 ABI 兼容的，windows-latest 上直接用。
            qt_arch: win64_msvc2019_64
            script: packaging/package-windows.sh
          - name: macOS universal
            os: macos-latest
            qt_arch: clang_64
            script: packaging/package-macos.sh
          - name: Linux x86_64
            os: ubuntu-latest
            qt_arch: linux_gcc_64
            script: packaging/package-linux.sh

    steps:
      # submodule 未初始化时 CMake 会主动报错，但这里直接拉好更省事
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      # Ninja 不假设 runner 自带，统一用 pip 装 —— 三个平台同一条命令，
      # 且把它的 bin 目录显式写进 PATH，避免"找不到 Ninja"这类平台差异。
      - name: 安装 Ninja
        shell: bash
        run: |
          python -m pip install --quiet ninja
          echo "$(python -c 'import ninja; print(ninja.BIN_DIR)')" >> "$GITHUB_PATH"

      # MSVC 工具链需要 vcvars 环境；windows runner 默认 PATH 里没有 cl.exe，
      # 而 Ninja 生成器不会像 VS 生成器那样自己去注册表找 MSVC。
      - name: 准备 MSVC 环境
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # 链接 Qt6Widgets 需要这些系统库，否则 Linux 上会在链接阶段失败
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1

      - name: 取版本号
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi

      - name: 配置
        shell: bash
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: |
          extra=()
          if [ "${{ runner.os }}" = "macOS" ]; then
            # 出 universal 二进制；Qt 的 mac 包本身已经是 universal
            extra+=("-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64")
          fi
          cmake --preset ci "${extra[@]}"

      - name: 构建
        shell: bash
        run: |
          # 构建输出落盘，失败时把关键行提升为 GitHub 注解。
          #
          # 这么做的理由：**job 日志必须用仓库写权限才能下载**
          # （GET /actions/jobs/<id>/logs 匿名请求返回
          #  "Must have admin rights to Repository."），
          # 而 check-run 的注解是匿名可读的。把编译器错误做成注解，
          # 没有凭据的一方也能直接定位失败原因，不必再让人手工贴日志。
          if cmake --build --preset ci --parallel > /tmp/build.log 2>&1; then
            tail -3 /tmp/build.log
            exit 0
          fi

          echo "构建失败。关键行："
          grep -nE 'error:|error [A-Z]+[0-9]+:|fatal error|undefined reference|cannot find|FAILED:' /tmp/build.log \
            | head -20 | while IFS= read -r line; do echo "::error::$line"; done

          echo "----- 日志末尾 15 行 -----"
          tail -15 /tmp/build.log | while IFS= read -r line; do echo "::warning::$line"; done
          exit 1

      # 测试只链接 core，不需要图形环境
      # 失败时要能看见**哪个用例、哪条断言**：ctest 不带 --output-on-failure 只会给一句
      # "1 tests failed"，而 GitHub 的 job 日志匿名读不到（需要仓库写权限），
      # 于是失败原因会完全不可见。这里把关键行提升为 ::error:: 注解 —— **注解是匿名可读的**。
      - name: 测试
        shell: bash
        run: |
          if ctest --preset ci --output-on-failure > /tmp/test.log 2>&1; then
            grep -E 'Test #|tests passed|test cases:' /tmp/test.log || true
          else
            # 注：GitHub 对每个 step 的注解有数量上限（10 条左右），所以摘要压成**一条**
            # （用 %0A 在消息里换行），免得它把后面"崩溃前跑到的用例"挤掉。
            grep -E 'Test #[0-9]+|tests passed|FAILED|ERROR:|test cases:|assertions:|Exit code' /tmp/test.log \
              | tail -20 | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/summary.txt
            echo "::error::测试失败摘要：$(cat /tmp/summary.txt)"

            # ---- 崩溃（不是断言失败）时，上面那几行说明不了问题 ----
            # ctest 对崩溃只给一句 "Exit code 0xc0000374***Exception"（0xc0000374 是
            # STATUS_HEAP_CORRUPTION），既没有失败的断言，也没有"跑到哪儿了"。
            # 这时带 --success 重跑一次：每个用例名都会打出来，
            # **崩溃前的最后一条就是元凶**。测试可执行文件已关掉输出缓冲（见 tests/main.cpp），
            # 所以崩溃前的内容不会随进程一起丢。
            echo "::error::测试异常退出 —— 带 --success 重跑以定位崩溃点"
            ./build/ci/bin/batchsmith_tests -s -nv > /tmp/unit.log 2>&1 || true
            grep -a '^TEST CASE:' /tmp/unit.log | tail -3 | while IFS= read -r line; do
              echo "::error::崩溃前最后跑到的用例：$line"
            done
            tail -12 /tmp/unit.log | tr -d '\r' | sed -e 's/%/%25/g' \
              | awk '{printf "%s%%0A", $0}' > /tmp/tail.txt
            echo "::error::测试输出尾部：$(cat /tmp/tail.txt)"
            exit 1
          fi

      # CHM 帮助手册（Windows 原生帮助格式：双击即看、带左侧目录树）
      #
      # 放在「打包」之前，这样 package-windows.sh 会把它一起打进 zip。
      # hhc.exe 从 HTML Help Workshop 的自解压 CAB 里直接取出 —— 不跑安装器、
      # 不改注册表、不需要管理员（微软官方下载已下线，细节见 packaging/fetch-hhc.sh）。
      #
      # continue-on-error：拿不到工具不该让整个 CI 变红。CHM 是锦上添花，
      # 三个平台的包里都已经附了 HTML 手册（浏览器可直接打开）。
      - name: 生成 CHM 帮助手册
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          bash packaging/fetch-hhc.sh build/chm/tools
          VERSION="${{ env.VERSION }}" bash packaging/make-chm.sh "$PWD/build/ci" "$PWD/dist"

      - name: 打包
        shell: bash
        env:
          QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}
        run: bash "${{ matrix.script }}" "$PWD/build/ci" "$PWD/dist"

      # 只上传**打包好的归档**，不含 dist/ 下的暂存目录。
      #
      # 原先写的是 dist/*，于是每个 artifact 里同时装着「已部署的暂存目录」与
      # 「归档」两份内容，体积接近翻倍（Windows 实测：zip 11.5MB，artifact 36.5MB）。
      # 更要紧的是 release 作业那边：它用 merge-multiple 把三个 artifact 合并进同一
      # 目录，三个平台的 BatchSmith/ 暂存目录会**互相覆盖**，而且 gh release upload
      # 的 artifacts/* 里还会混进一个目录参数 —— 首次打 v* tag 时大概率直接失败。
      # 只传归档后：三个产物文件名互不冲突，Release 附件就是三个干净的归档。
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BatchSmith-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 打 v* tag 时创建 GitHub Release 并附上三平台产物
  # =========================================================================
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出将要发布的文件
        run: ls -lh artifacts

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 幂等：重跑同一个 tag 时改为覆盖上传，而不是直接失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传产物"
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" \
              --title "BatchSmith $TAG" \
              --generate-notes \
              artifacts/*
          fi

  # =========================================================================
  # 代码格式
  # =========================================================================
  format:
    name: 代码格式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 clang-format
        run: pip install 'clang-format==18.1.8'

      - name: 校验格式
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            -print0 | xargs -0 -r clang-format --dry-run --Werror
