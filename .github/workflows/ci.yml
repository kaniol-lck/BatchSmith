name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 发版需要创建 Release；其余步骤只读
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # tag 构建不允许被后来的推送取消，否则会发出不完整的 Release
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  QT_VERSION: '6.7.2'

jobs:
  # =========================================================================
  # 构建 + 测试 + 打包（三平台）
  # =========================================================================
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            # ⚠ 必须用 msvc2019_64：Qt 6.7.2 的 Windows 包只有
            #   win64_msvc2019_64 / win64_msvc2019_arm64 / win64_mingw / win64_llvm_mingw，
            #   **不存在 msvc2022_64**（该后缀到 Qt 6.8 才出现）。
            #   写错的话 install-qt-action 会在下载前就失败，与代码无关。
            #   msvc2019_64 的二进制与 VS2022 是 ABI 兼容的，windows-latest 上直接用。
            qt_arch: win64_msvc2019_64
            script: packaging/package-windows.sh
          - name: macOS universal
            os: macos-latest
            qt_arch: clang_64
            script: packaging/package-macos.sh
          - name: Linux x86_64
            os: ubuntu-latest
            qt_arch: linux_gcc_64
            script: packaging/package-linux.sh

    steps:
      # submodule 未初始化时 CMake 会主动报错，但这里直接拉好更省事
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      # Ninja 不假设 runner 自带，统一用 pip 装 —— 三个平台同一条命令，
      # 且把它的 bin 目录显式写进 PATH，避免"找不到 Ninja"这类平台差异。
      - name: 安装 Ninja
        shell: bash
        run: |
          python -m pip install --quiet ninja
          echo "$(python -c 'import ninja; print(ninja.BIN_DIR)')" >> "$GITHUB_PATH"

      # MSVC 工具链需要 vcvars 环境；windows runner 默认 PATH 里没有 cl.exe，
      # 而 Ninja 生成器不会像 VS 生成器那样自己去注册表找 MSVC。
      - name: 准备 MSVC 环境
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # 链接 Qt6Widgets 需要这些系统库，否则 Linux 上会在链接阶段失败
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1

      - name: 取版本号
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi

      - name: 配置
        shell: bash
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: |
          extra=()
          if [ "${{ runner.os }}" = "macOS" ]; then
            # 出 universal 二进制；Qt 的 mac 包本身已经是 universal
            extra+=("-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64")
          fi
          cmake --preset ci "${extra[@]}"

      - name: 构建
        shell: bash
        run: |
          # 构建输出落盘，失败时把关键行提升为 GitHub 注解。
          #
          # 这么做的理由：**job 日志必须用仓库写权限才能下载**
          # （GET /actions/jobs/<id>/logs 匿名请求返回
          #  "Must have admin rights to Repository."），
          # 而 check-run 的注解是匿名可读的。把编译器错误做成注解，
          # 没有凭据的一方也能直接定位失败原因，不必再让人手工贴日志。
          if cmake --build --preset ci --parallel > /tmp/build.log 2>&1; then
            tail -3 /tmp/build.log
            exit 0
          fi

          echo "构建失败。关键行："
          grep -nE 'error:|error [A-Z]+[0-9]+:|fatal error|undefined reference|cannot find|FAILED:' /tmp/build.log \
            | head -20 | while IFS= read -r line; do echo "::error::$line"; done

          echo "----- 日志末尾 15 行 -----"
          tail -15 /tmp/build.log | while IFS= read -r line; do echo "::warning::$line"; done
          exit 1

      # 测试只链接 core，不需要图形环境
      # 失败时要能看见**哪个用例、哪条断言**：ctest 不带 --output-on-failure 只会给一句
      # "1 tests failed"，而 GitHub 的 job 日志匿名读不到（需要仓库写权限），
      # 于是失败原因会完全不可见。这里把关键行提升为 ::error:: 注解 —— **注解是匿名可读的**。
      - name: 测试
        shell: bash
        # 临时（`0xc0000374` 未定位期间）：**非 tag 的推送**上，Windows 这一条不阻断整轮 CI。
        # 理由：这个失败从引入 Lua 沙箱起就一直挂着，而"每推一次就整轮红"除了让人习惯性
        # 忽略红色、没有任何收益；证据采集与结论报在 `windows-memdump` 作业里。
        #
        # 两点保留：① 这一步在 UI 里**照样标红**（只是不再把 job 拖成 failure），
        # 所以"它在红"这件事仍然看得见；② **tag 推送照旧阻断**，免得坏着发版。
        # 定位之后把这一行删掉。
        continue-on-error: ${{ runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if ctest --preset ci --output-on-failure > /tmp/test.log 2>&1; then
            grep -E 'Test #|tests passed|test cases:' /tmp/test.log || true
          else
            # 注：GitHub 对每个 step 的注解有数量上限（10 条左右），所以摘要压成**一条**
            # （用 %0A 在消息里换行），免得它把后面"崩溃前跑到的用例"挤掉。
            grep -E 'Test #[0-9]+|tests passed|FAILED|ERROR:|test cases:|assertions:|Exit code' /tmp/test.log \
              | tail -20 | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/summary.txt
            echo "::error::测试失败摘要：$(cat /tmp/summary.txt)"

            # ---- 崩溃（不是断言失败）时，上面那几行说明不了问题 ----
            # ctest 对崩溃只给一句 "Exit code 0xc0000374***Exception"（0xc0000374 是
            # STATUS_HEAP_CORRUPTION），既没有失败的断言，也没有"跑到哪儿了"。
            # 这时带 --success 重跑一次：每个用例名都会打出来，
            # **崩溃前的最后一条就是元凶**。测试可执行文件已关掉输出缓冲（见 tests/main.cpp），
            # 所以崩溃前的内容不会随进程一起丢。
            echo "::error::测试异常退出 —— 带 --success 重跑以定位崩溃点"
            # 加超时：无缓冲 + --success 的输出量很大，这一步明显比正常路径慢；
            # 万一卡住，宁可放弃用例名（ctest 那边的信息还在），也不能把 job 拖死。
            timeout 300 ./build/ci/bin/batchsmith_tests -s -nv > /tmp/unit.log 2>&1 || true
            grep -a '^TEST CASE:' /tmp/unit.log | tail -3 | while IFS= read -r line; do
              echo "::error::崩溃前最后跑到的用例：$line"
            done
            tail -12 /tmp/unit.log | tr -d '\r' | sed -e 's/%/%25/g' \
              | awk '{printf "%s%%0A", $0}' > /tmp/tail.txt
            echo "::error::测试输出尾部：$(cat /tmp/tail.txt)"
            exit 1
          fi

      # CHM 帮助手册（Windows 原生帮助格式：双击即看、带左侧目录树）
      #
      # 放在「打包」之前，这样 package-windows.sh 会把它一起打进 zip。
      # hhc.exe 从 HTML Help Workshop 的自解压 CAB 里直接取出 —— 不跑安装器、
      # 不改注册表、不需要管理员（微软官方下载已下线，细节见 packaging/fetch-hhc.sh）。
      #
      # continue-on-error：拿不到工具不该让整个 CI 变红。CHM 是锦上添花，
      # 三个平台的包里都已经附了 HTML 手册（浏览器可直接打开）。
      - name: 生成 CHM 帮助手册
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          bash packaging/fetch-hhc.sh build/chm/tools
          VERSION="${{ env.VERSION }}" bash packaging/make-chm.sh "$PWD/build/ci" "$PWD/dist"

      - name: 打包
        shell: bash
        env:
          QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}
        run: bash "${{ matrix.script }}" "$PWD/build/ci" "$PWD/dist"

      # 只上传**打包好的归档**，不含 dist/ 下的暂存目录。
      #
      # 原先写的是 dist/*，于是每个 artifact 里同时装着「已部署的暂存目录」与
      # 「归档」两份内容，体积接近翻倍（Windows 实测：zip 11.5MB，artifact 36.5MB）。
      # 更要紧的是 release 作业那边：它用 merge-multiple 把三个 artifact 合并进同一
      # 目录，三个平台的 BatchSmith/ 暂存目录会**互相覆盖**，而且 gh release upload
      # 的 artifacts/* 里还会混进一个目录参数 —— 首次打 v* tag 时大概率直接失败。
      # 只传归档后：三个产物文件名互不冲突，Release 附件就是三个干净的归档。
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BatchSmith-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 打 v* tag 时创建 GitHub Release 并附上三平台产物
  # =========================================================================
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出将要发布的文件
        run: ls -lh artifacts

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 幂等：重跑同一个 tag 时改为覆盖上传，而不是直接失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传产物"
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" \
              --title "BatchSmith $TAG" \
              --generate-notes \
              artifacts/*
          fi

  # =========================================================================
  # Windows 内存诊断：Debug 构建 + CRT 调试堆
  #
  # 为什么单独一个 job：Windows 的单元测试从引入 Lua 沙箱那一轮起就以
  # `Exit code 0xc0000374`（STATUS_HEAP_CORRUPTION，堆损坏）收场，而 Linux、macOS
  # 与本机 MinGW 全绿 —— 说明有一处内存越界，只在 MSVC 的堆布局下才暴露。
  #
  # Release 构建用的是发布版 CRT，分配里没有守卫字节：越界写会悄悄发生，直到某块
  # 内存被释放才由 OS 发现（就是那个 0xc0000374），而那时崩溃点已经是**被害者**。
  # Debug 构建用调试堆，每块分配前后都有守卫字节，"第一个让堆变得不一致的用例"
  # 会被直接指出来（见 tests/main.cpp 的 HeapCheckListener）。
  #
  # 这个 job 不影响发布：只编 core 测试，不打包、不上传产物。
  # =========================================================================
  windows-heapcheck:
    name: Windows 内存诊断
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          cache: true

      - name: 安装 Ninja
        shell: bash
        run: |
          python -m pip install --quiet ninja
          echo "$(python -c 'import ninja; print(ninja.BIN_DIR)')" >> "$GITHUB_PATH"

      - name: 准备 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置（Debug，不含界面）
        shell: bash
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: cmake --preset ci-debug

      - name: 构建 core 测试
        shell: bash
        run: |
          if cmake --build --preset ci-debug --target batchsmith_tests --parallel \
               > /tmp/build.log 2>&1; then
            tail -2 /tmp/build.log
          else
            grep -nE 'error [A-Z]+[0-9]+:|error:|fatal error' /tmp/build.log | head -10 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: 跑测试（每个用例之后校验堆）
        shell: bash
        run: |
          exe=./build/ci-debug/bin/batchsmith_tests.exe

          echo "=== 1) 整跑一遍：报告"第一个让堆不一致的用例" ==="
          set +e
          "$exe" -s -nv > /tmp/all.log 2>&1
          code=$?
          set -e

          # 这是本 job 的核心产出：越界写的**发生点**（而不是崩溃点）
          if grep -aq '\[heap\]' /tmp/all.log; then
            grep -a '\[heap\]' /tmp/all.log | head -5 | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            echo "整跑未报堆不一致（退出码 $code）—— 继续逐个用例排查"
          fi

          grep -aE 'test cases:|assertions:|Status:' /tmp/all.log | tail -3 | tr -d '\r'

          echo "=== 2) 逐个用例单独跑一个进程：崩了的用例就是元凶 ==="
          # 单独进程跑的价值：整跑时「崩在 Y」只能说明 Y 是受害者；
          # 一个用例单独跑还崩，那个用例自己才是元凶。
          #
          # ⚠️ 选用例**必须用序号**（--first/--last），不能再用 -tc="$name"：
          #    doctest 的用例名是中文，而 Windows 上非 ASCII 的 argv 会按 ANSI 代码页
          #    解码，跟二进制里的 UTF-8 字面量对不上 ⇒ 过滤命中 0 个 ⇒ **每次单跑都"成功"**。
          #    本机实测：`-tc="区段只允许表达式：赋值语句编译不过"` 一个用例都没跑到
          #    （`test cases: 0 | 155 skipped`、退出码 0），而 `--first=56 --last=56`
          #    真的跑到了那个用例。序号是纯 ASCII，不受编码影响。
          #
          # ⚠️⚠️ 自检**不能**看 `test cases:` 那个数字 —— doctest 打的是「通过过滤器的用例数」，
          #    而 `--first/--last` 的区间跳过是在这个计数**之后**才判的（见 doctest.h 的 run 循环）：
          #    单跑一个用例时它照样打 `test cases: 155 | 155 passed | 0 failed | 0 skipped`。
          #    第一版就是拿它当"有没有选到用例"的判据，于是 155 次全被判成"空跑"、
          #    作业白红了一轮。**可靠的判据是断言数**：真跑到了用例，就一定产生断言。
          set +e
          # doctest 的 --list-test-cases 是「两行表头 + 用例名 + 两行表尾」，且输出是 CRLF：
          # 直接用行号切会踩到 \r，按前缀过滤更稳。
          mapfile -t names < <("$exe" --list-test-cases | tr -d '\r' \
            | grep -v '^\[doctest\]' | grep -vE '^={10,}$')
          total=${#names[@]}
          echo "共 $total 个用例"
          bad=0
          empty=0
          idx=0
          while [ "$idx" -lt "$total" ]; do
            idx=$((idx + 1))
            "$exe" --first="$idx" --last="$idx" -s -nv > /tmp/one.log 2>&1
            rc=$?
            # 自检：这一次单跑到底有没有跑到用例（看断言数，别信 test cases 那个数字）
            if ! grep -aqE 'assertions: +[1-9]' /tmp/one.log; then
              empty=$((empty + 1))
              if [ "$empty" -le 3 ]; then
                echo "::error::单跑 #$idx 一个断言都没产生 —— 选到用例了吗？日志尾部：$(tail -3 /tmp/one.log | tr -d '\r' | tr '\n' '/')"
              fi
            fi
            if [ "$rc" -ne 0 ]; then
              bad=$((bad + 1))
              if [ "$bad" -le 8 ]; then
                echo "::error::单独跑 #$idx「${names[$((idx - 1))]}」异常退出，退出码 $rc"
                grep -a '\[heap\]' /tmp/one.log | head -1 | while IFS= read -r line; do
                  echo "::error::  $line"
                done
              else
                echo "单独跑 #$idx「${names[$((idx - 1))]}」异常退出，退出码 $rc（已超过注解上限，见日志）"
              fi
            fi
          done
          set -e

          # ---- 这一步自己也要能被质疑 ----
          # 原先无论结果如何都 exit 0，而且干净时一条注解都不发。于是"没有 [heap] 注解"
          # 既可能是"堆没问题"，也可能是"这一步什么都没跑到"（exe 路径写错 ⇒ 127 ⇒
          # cases.txt 为空 ⇒ $total=0 $bad=0 ⇒ 照样绿）。两种情况的差别只在日志里，
          # 而 job 日志匿名读不到（要仓库写权限）—— 所以：
          #   1) 干净时也发一条**正向**注解：warning 级匿名可读，又不会让 job 变红；
          #   2) 一个用例都没跑到就 exit 1 —— 诊断通道坏了，必须看得见；
          #   3) **只要有一次单跑没产生断言**（序号过滤失效 / 退回 -tc 的编码坑），
          #      也算通道坏了：那种"0 个异常退出"是假绿，不能当结论用。
          echo "逐个跑完成：$total 个用例里有 $bad 个异常退出；$empty 次单跑没产生断言"
          echo "::warning::堆诊断小结：整跑退出码 $code；$total 个用例逐个单跑，$bad 个异常退出，$empty 次没选到"
          if [ "$total" -eq 0 ] || [ "$empty" -gt 0 ]; then
            echo "::error::单跑通道没选到用例（$empty/$total 次）—— 本次结论不可信（exe 路径？序号过滤失效？）"
            exit 1
          fi

  # =========================================================================
  # Windows ASan：给那个 0xc0000374 换一台能"看见元凶"的仪器
  #
  # 为什么还需要它（heapcheck 那条路已经绿了）：两者看得见的东西不一样 ——
  # CRT 调试堆只在**每块分配的边界**放守卫字节，越界十几字节以上就落进相邻块，
  # 守卫字节依然完好（本机实测：故意踩坏块头，`HeapValidate` 也照样返回 TRUE，
  # 见 tests/main.cpp 的注释）。ASan 给每块分配加红区 + 在每次 load/store 上插检查，
  # 越界与"使用已释放内存"都会**在发生的那一行**报出来，不管落点是不是别人的块。
  #
  # 为什么用 Release 而不是 Debug：ASan 要求 /MD，与 Debug CRT（/MDd）不兼容；
  # 而 0xc0000374 恰恰只在 Release 出现 —— 正好对上要复现的那个配置。
  #
  # 与 heapcheck 一样**不影响发布**：只编 core 测试，不打包、不上传产物。
  #
  # 这个 job 的**绿色只允许**表示一件事：ASan 真的跑完了、什么都没报。
  # 配置失败 / 构建失败 / 产物不在 / 测试没跑起来 —— 一律判红，但注解里会写清
  # "是**本站作业**坏了，不是被测代码有问题"。绿色不该用来掩盖"仪器根本没开机"，
  # 那正是上面 heapcheck 刚修掉的毛病。
  #
  # ⚠️ 一个只在 Windows + bash 下才发作的坑（第一次跑就踩了，见 CHANGELOG）：
  #    传 `/x/y` 形状的参数给**原生**程序时，Git Bash 会把它当成 POSIX 路径改写掉 ——
  #    实测 `-DCMAKE_CXX_FLAGS="/fsanitize=address /Zi"` 变成
  #    `-DCMAKE_CXX_FLAGS=<Git 安装根>/fsanitize=address /Zi`。标志废掉之后
  #    CMake 连**编译器探测**都过不去，于是死在**配置步**（不是构建步，因为
  #    CMAKE_CXX_FLAGS 参与探测编译）。仓库里其它 job 传的都是 preset 名，
  #    没有 `/` 开头的参数，所以这个坑一直没暴露。下面显式关掉路径转换。
  # =========================================================================
  windows-asan:
    name: Windows ASan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          cache: true

      - name: 安装 Ninja
        shell: bash
        run: |
          python -m pip install --quiet ninja
          echo "$(python -c 'import ninja; print(ninja.BIN_DIR)')" >> "$GITHUB_PATH"

      - name: 准备 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1

      # 用显式命令而不是 preset：ASan 需要往 C/CXX/Linker 三处都塞标志，
      # preset 里没有这些开关，塞进去反而让日常构建也带上。
      #   * 关掉 GUI 与 CLI —— 要复现的是 core 测试，少编几分钟
      #   * /Zi —— ASan 报告要印 file:line，需要调试信息
      #   * /INCREMENTAL:NO —— ASan 与增量链接不兼容
      #   * BATCHSMITH_LTO=OFF —— 注意：**在 MSVC 上本来就是个空开关**
      #     （CMakeLists 的 LTO 分支写着 `if(BATCHSMITH_LTO AND NOT MSVC)`），
      #     这里显式关掉只是为了这个作业以后被搬到别的平台时不会踩 ASan×LTO 冲突。
      #     别在别处说"关掉 LTO 才让 ASan 在 Windows 上能用"—— 那与事实不符。
      - name: 配置（Release + ASan，不含界面）
        shell: bash
        env:
          # ⚠️ 必须关掉参数路径转换：否则 `/fsanitize=address` 会被 Git Bash
          #    当成 POSIX 路径换成 `<Git 安装根>/fsanitize=address`，标志变垃圾，
          #    配置步直接死（CMake 的编译器探测用 CMAKE_CXX_FLAGS）。
          #    两个变量分别是 Git for Windows 与 MSYS2 的开关，一起设上。
          MSYS_NO_PATHCONV: '1'
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          # 取**运行时**环境里的 QT_ROOT_DIR（install-qt-action 通过 GITHUB_ENV 交出来），
          # 而不是 `${{ env.QT_ROOT_DIR }}` —— 后者是解析期展开，排在安装步骤之前，
          # 拿不到值就是空串，症状会是一句离根因很远的 find_package(Qt6) 失败。
          if [ -z "${QT_ROOT_DIR:-}" ]; then
            echo "::error::ASan 作业的配置步失败：QT_ROOT_DIR 为空（install-qt-action 没交出 Qt 路径）—— 这是**本站作业**的问题，不是被测代码的问题"
            exit 1
          fi
          echo "Qt 前缀: $QT_ROOT_DIR"

          set +e
          cmake -S . -B build/asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBATCHSMITH_BUILD_GUI=OFF \
            -DBATCHSMITH_BUILD_CLI=OFF \
            -DBATCHSMITH_LTO=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_C_FLAGS="/fsanitize=address /Zi" \
            -DCMAKE_CXX_FLAGS="/fsanitize=address /Zi" \
            -DCMAKE_EXE_LINKER_FLAGS="/INCREMENTAL:NO" \
            > /tmp/configure.log 2>&1
          code=$?
          set -e

          if [ "$code" -ne 0 ]; then
            tail -20 /tmp/configure.log | tr -d '\r' | sed -e 's/%/%25/g' \
              | while IFS= read -r line; do echo "::warning::$line"; done
            echo "::error::ASan 作业的**配置步**失败（退出码 $code）—— 这是本站作业的问题（CI 上的标志/工具链变了？），不是被测代码的问题。日志尾部见上面几条 warning"
            exit 1
          fi
          tail -3 /tmp/configure.log | tr -d '\r'

      - name: 构建并跑测试（ASan）
        shell: bash
        run: |
          exe=./build/asan/bin/batchsmith_tests.exe

          set +e
          cmake --build build/asan --target batchsmith_tests --parallel > /tmp/build.log 2>&1
          build_code=$?
          set -e

          if [ "$build_code" -ne 0 ]; then
            tail -8 /tmp/build.log | tr -d '\r' | sed -e 's/%/%25/g' \
              | while IFS= read -r line; do echo "::warning::$line"; done
            echo "::error::ASan 作业的**构建步**失败（退出码 $build_code）—— 这是本站作业的问题（例如本 runner 上 /fsanitize=address 不可用），不是被测代码的问题。日志尾部见上面几条 warning"
            exit 1
          fi
          tail -2 /tmp/build.log | tr -d '\r'

          # 同一个教训：这一步也不能"什么都没跑到"还绿着（这正是 heapcheck 原先的毛病）。
          if [ ! -f "$exe" ]; then
            echo "::error::ASan 构建成功但没找到 $exe（产物路径变了？）—— 本站作业的问题，不是被测代码的问题"
            exit 1
          fi

          # abort_on_error=0：让 ASan 报完继续跑，一次能收齐多处问题；
          # detect_leaks=0：Qt 的全局对象本来就会留下"可达"内存，泄漏检查是噪声。
          set +e
          ASAN_OPTIONS="detect_leaks=0:abort_on_error=0:print_summary=1" \
            "$exe" -s -nv > /tmp/asan.log 2>&1
          code=$?
          set -e

          # ASan 的报告行提升为注解（注解匿名可读，job 日志不是）——
          # 与「测试」步骤里那套做法一致。
          if grep -aqE 'ERROR: AddressSanitizer|SUMMARY: AddressSanitizer' /tmp/asan.log; then
            grep -aE 'ERROR: AddressSanitizer|SUMMARY: AddressSanitizer|^ *#[0-9]+ ' /tmp/asan.log \
              | head -30 | tr -d '\r' | sed -e 's/%/%25/g' \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

          # 没有 ASan 报错，但连 doctest 的收尾统计都没有 ⇒ 测试根本没跑起来，别报"干净"。
          if ! grep -aq 'test cases:' /tmp/asan.log; then
            tail -12 /tmp/asan.log | tr -d '\r' | sed -e 's/%/%25/g' \
              | while IFS= read -r line; do echo "::warning::$line"; done
            echo "::error::ASan 没有报错，但测试也没跑起来（退出码 $code）—— 本次结论不可信"
            exit 1
          fi

          # 与 heapcheck 一样：干净时也留一条**正向**注解。job 日志匿名读不到，
          # 不带注解只有两种解读 —— "ASan 跑过且干净"和"这一步什么都没跑到"，必须能分开。
          echo "ASan 没有报错（测试退出码 $code）"
          grep -aE 'test cases:|assertions:' /tmp/asan.log | tail -2 | tr -d '\r'
          echo "::warning::ASan 小结：未报告内存错误；$(grep -aE 'test cases:' /tmp/asan.log | tail -1 | tr -d '\r')"

  # =========================================================================
  # Windows 内存证据包：把"能带出 CI 的证据"挂成 Release 附件
  #
  # 为什么不用 actions/upload-artifact：**制品的下载接口匿名读不到**。
  # 实测 `GET /repos/<o>/<r>/actions/artifacts/<id>/zip` 匿名返回
  # `401 {"message":"Requires authentication"}`，网页那条 `.../artifacts/<id>` 也是 404；
  # 而 **Release 附件可以匿名下载**（实测 jq 的 release 资产匿名 200）。
  # 所以证据包固定挂在一个预发布 `ci-diag` 上、每次覆盖 —— 不写 git 历史、不占制品配额，
  # 而且 tag 名不是 `v*`，不会触发本 workflow 的发布链路。
  #
  # 采集什么（按"能不能指认元凶"排序）：
  #   1) **PageHeap**（保护页）下再跑一遍：它不依赖插桩，越界会在**写的那条指令**上变成 AV。
  #      ASan 已经证过"被插桩代码里没有问题"，所以下一步就该换这台不插桩的仪器。
  #   2) **自检**：先用一个故意越界的探针程序确认"全页堆在这台 runner 上真的开着"。
  #      没有自检的话，"PageHeap 下没崩"到底是没问题、还是仪器根本没开，分不清 ——
  #      这正是本仓库已经踩过的"沉默不等于干净"。
  #   3) **WER 事件日志**（XML）给出出错模块 + 偏移 + 异常码；配上链接器 **`.map`**，
  #      偏移就能在本地翻成函数名 —— 不需要调试器，也不需要仓库写权限。
  #   4) 普通 Release 跑一遍的输出（与 CI 红点同配置）+ 崩溃前最后几条用例。
  #   5) 迷你转储（只在体积可控时带上）。
  #
  # 这个 job 不判红（continue-on-error）：采集失败也不该把整轮 CI 拖红。
  # 结论同时用**注解**发一遍 —— 注解是唯一匿名可读的 job 内部通道。
  # =========================================================================
  windows-memdump:
    name: Windows 内存证据包
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          cache: true

      - name: 安装 Ninja
        shell: bash
        run: |
          python -m pip install --quiet ninja
          echo "$(python -c 'import ninja; print(ninja.BIN_DIR)')" >> "$GITHUB_PATH"

      - name: 准备 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1

      # `/MAP` 是这一步的重点：WER 只给"模块 + 偏移"，有了 map 才能在本地翻成函数名。
      # ⚠️ 两个 MSYS 变量必须设：`/MAP`、`/INCREMENTAL:NO` 这类 `/` 开头、且**值里带
      #    第二段斜杠**的参数会被 Git Bash 改写成路径（见 CHANGELOG 与下一节的说明）。
      - name: 配置（Release + /MAP，不含界面）
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          if [ -z "${QT_ROOT_DIR:-}" ]; then
            echo "::error::内存证据包：QT_ROOT_DIR 为空，配置无法进行（本站作业的问题，不是被测代码的问题）"
            exit 1
          fi
          set +e
          # ⚠️ `-DBATCHSMITH_BUILD_CLI` 必须是 **ON**：④c 探针要跑 `bs.exe`，
          #    而 CLI 目标由 `src/cli` 提供、只在 `BATCHSMITH_BUILD_CLI` 下 add_subdirectory
          #    （顶层 CMakeLists:149）。上一轮这里写的是 OFF，于是构建步直接死在
          #    `ninja: error: unknown target 'bs'`，整个证据包作业报废一轮。
          #    只影响"多编一个 CLI 目标"，不改变 core/测试的编译参数 ⇒ 与红点同配置这一点不受影响。
          cmake -S . -B build/diag -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBATCHSMITH_BUILD_GUI=OFF \
            -DBATCHSMITH_BUILD_CLI=ON \
            -DBATCHSMITH_CRASH_REPORT=ON \
            -DBATCHSMITH_MESSAGE_TRACE=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_EXE_LINKER_FLAGS="/INCREMENTAL:NO /MAP" \
            > /tmp/configure.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            tail -20 /tmp/configure.log | tr -d '\r' | sed -e 's/%/%25/g' \
              | while IFS= read -r l; do echo "::warning::$l"; done
            echo "::error::内存证据包：配置失败（退出码 $code）—— 本站作业的问题，不是被测代码的问题"
            exit 1
          fi
          tail -3 /tmp/configure.log

          # 预检（这一道是拿真金白银换来的）：④c 探针要跑 `bs.exe`，而它只由 CLI 目标产出。
          # 上一轮的教训是"构建步才发现 ninja 根本不认识 bs 目标" —— 而配置摘要在**配置完成的
          # 那一刻**就已经把 GUI/CLI/TESTS 三个开关打印出来了，所以完全可以在动用构建时间之前判死。
          # 一般化：本作业后面每一步要用到的**目标 / 文件**，都要在这里先做一次存在性自证。
          if ! grep -q 'CLI=ON' /tmp/configure.log; then
            grep -a '构建目标' /tmp/configure.log | tr -d '\r' | sed -e 's/%/%25/g' \
              | while IFS= read -r l; do echo "::warning::$l"; done
            echo "::error::内存证据包：配置摘要里 CLI 不是 ON ⇒ ④c 要用的 bs.exe 不会被构建（本站作业的问题，不是被测代码的问题）"
            exit 1
          fi
          # 同一个道理，第二道：④c 的正主是 CLI 的崩溃自报。它没开的话，
          # 崩溃时照样什么都不打（run #27 实测 WER 与输出文件都是 0 字节），
          # 整轮又白跑 —— 而"摘要里有没有这一行"在配置阶段就能判。
          if ! grep -q '崩溃自报' /tmp/configure.log; then
            echo "::error::内存证据包：配置摘要里没有「崩溃自报」⇒ ④c 崩了也拿不到出错指令 RVA（本站作业的问题）"
            exit 1
          fi
          # 第三道：本轮新增的消息追踪。它只在诊断构建里有实现（`BATCHSMITH_MESSAGE_TRACE`），
          # 关着的话三行探针输出会**一条都没有**（实现是空函数），而日志看起来完全正常
          # —— 于是"探针没说话"会被误读成"消息一直是好的"，比白跑一轮更坏（会把人引到错的方向）。
          if ! grep -q '消息追踪' /tmp/configure.log; then
            echo "::error::内存证据包：配置摘要里没有「消息追踪」⇒ 三处探针是空实现，读不到任何东西（本站作业的问题）"
            exit 1
          fi
          grep -a '构建目标\|崩溃自报\|消息追踪' /tmp/configure.log | tr -d '\r' || true

      - name: 构建 core 测试（含 CLI bs：④c 的探针要用它绕开 doctest）
        shell: bash
        run: |
          set +e
          cmake --build build/diag --target batchsmith_tests bs --parallel > /tmp/build.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            tail -20 /tmp/build.log | tr -d '\r' | sed -e 's/%/%25/g' \
              | while IFS= read -r l; do echo "::warning::$l"; done
            echo "::error::内存证据包：构建失败（退出码 $code）—— 本站作业的问题，不是被测代码的问题"
            exit 1
          fi
          tail -2 /tmp/build.log
          ls -la build/diag/bin/

      - name: 采集（普通跑 + PageHeap 自检 + PageHeap 跑 + WER + 转储）
        shell: bash
        env:
          # 这一步要给 cl.exe 塞 `/Od`、`/nologo`，理由同上
          MSYS_NO_PATHCONV: '1'
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          set -u
          bundle="$RUNNER_TEMP/diag"
          mkdir -p "$bundle" /c/diag-dumps
          exe="$PWD/build/diag/bin/batchsmith_tests.exe"
          map="$PWD/build/diag/bin/batchsmith_tests.map"
          # ⚠️ 交给 **python** 的路径必须是 Windows 形态（`D:\a\...`），不能是 Git Bash
          #    的 `/d/a/...`：bash 自己的程序（ls / timeout / cp）两种都认，
          #    python 的 subprocess 只认前者。run #23 就死在这上面 —— `exe="$PWD/..."`
          #    交给 runexe.py 后立刻 FileNotFoundError，而 `set -e` 把整个采集步
          #    **静默**中止：日志里只剩 "Process completed with exit code 1"，
          #    连 PageHeap / 嫌犯单跑 / WER / 摘要全都没来得及做。
          #    （同类前科：relative 入参 `cygpath -m` 原样返回那个坑。）
          exe_win=$(cygpath -w "$exe")
          echo "exe(bash)=$exe"
          echo "exe(python)=$exe_win"
          python -c "import os,sys; sys.exit(0 if os.path.isfile(sys.argv[1]) else 9)" "$exe_win" \
            || { echo "::error::内存证据包：python 视角下 exe 不存在（$exe_win）—— 本站作业的问题"; exit 1; }
          ls -la "$exe" "$map"

          # 进度标记：采集步很长，任何一步静默退出都会让"死在哪"变成猜谜。
          # 每进入一段就打一行；日志里最后一条标记就是断点。
          mark() { echo "--- 采集进度: $* ---"; }

          last_case() {
            grep -a '^TEST CASE:' "$1" 2>/dev/null | tail -1 || true
          }

          # ---------- WER 本地转储：迷你转储（含线程栈），体积可控 ----------
          wer='HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          reg add "$wer" /v DumpFolder /t REG_EXPAND_SZ /d 'C:\diag-dumps' /f
          reg add "$wer" /v DumpType   /t REG_DWORD   /d 1 /f
          reg add "$wer" /v DumpCount  /t REG_DWORD   /d 3 /f
          reg query "$wer" /v DumpType || true

          test_ifeo='HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\batchsmith_tests.exe'
          probe_ifeo='HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\pageheap_probe.exe'
          # ④c 的探针：CLI bs.exe 也要单独开全页堆（IFEO 键是按 exe 名分的）
          bs_ifeo='HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\bs.exe'

          # ---------- ① 普通 Release 跑一遍（与 CI 红点同配置）----------
          #
          # ⚠️ bash 报的退出码是残缺的：Git Bash 对「无法映射到信号的 NTSTATUS」一律报 **127**，
          #    而那正好也是「命令找不到」的退出码。本机探针实测
          #    （`.workbuddy/tools/statusprobe/exc.c`，抛指定异常码）：
          #      0xC0000374（堆损坏）→ 127     0xC00000FD（栈溢出）→ 127
          #      0xC0000005（访问违例）→ 139   0xC000001D（非法指令）→ 132
          #    ⇒ 看到 127 **不能**推断"脚本没找着 exe"（上一轮就是这么误判的）。
          #
          #    拿完整 32 位退出码改用 **python**（runner 上本来就有，装 ninja 用的就是它）：
          #    `subprocess.run().returncode` 对原生崩溃给的就是完整值（0xC0000374 → -1073740940）。
          #    ⚠️ **别用 PowerShell 的 `Start-Process -PassThru`**：实测它的 `ExitCode` 是 **null**，
          #    打印出来是 `exit=4294967296 hex=0x` —— 等于没测（上一轮四个嫌犯单跑全部作废）。
          cat > "$RUNNER_TEMP/runexe.py" <<'PY_EOF'
          import os, re, subprocess, sys
          exe, tag = sys.argv[1], sys.argv[2]
          # 先自证入参可用：一旦路径形态不对（例如收到 /d/a/... 这种 Git Bash 路径），
          # 要说清楚是"这站作业传错了"，而不是抛一个 FileNotFoundError 让人去猜。
          if not os.path.isfile(exe):
              print('ERROR runexe: python 看不到 exe: %r' % exe)
              sys.exit(9)
          args = ['-s', '-nv']
          m = re.fullmatch(r'c(\d+)', tag)
          if m:
              args = ['--first=' + m.group(1), '--last=' + m.group(1)] + args
          else:
              m = re.fullmatch(r'r(\d+)-(\d+)', tag)
              if m:
                  args = ['--first=' + m.group(1), '--last=' + m.group(2)] + args
          out = os.path.join(os.environ.get('RUNNER_TEMP', '.'), 'ps-' + tag + '.out.txt')
          with open(out, 'wb') as fh:
              rc = subprocess.run([exe] + args, stdout=fh, stderr=subprocess.STDOUT).returncode
          code = rc if rc >= 0 else rc + 2 ** 32   # Windows 退出码是 DWORD，python 给的是有符号值
          with open(out, 'rb') as fh:
              cases = sum(1 for line in fh if line.startswith(b'TEST CASE:'))
          print('exit=%d hex=0x%08X cases=%d out=%s' % (code, rc, cases, out))
          PY_EOF

          runexe() {  # $1 = 标签：plain / c55 / c56 / c57 / r55-57
            # 刻意**吞掉** runexe.py 的非零退出并把它打成一行可见的输出：
            # 调用点全在 `set -e` 生效之后，直接让它失败会把整步静默带走
            # （run #23 的教训：只剩一句 "exit code 1"，四段证据全丢）。
            local out rc
            out=$(python "$RUNNER_TEMP/runexe.py" "$exe_win" "$1" 2>&1)
            rc=$?
            if [ "$rc" -ne 0 ]; then
              printf 'runexe(%s) 失败 rc=%d: %s\n' "$1" "$rc" \
                "$(printf '%s' "$out" | tr '\n' '|' | tail -c 400)"
            else
              printf '%s\n' "$out" | tr -d '\r' | tail -1
            fi
          }

          mark "① 普通 Release 跑（与 CI 红点同配置）"
          reg delete "$test_ifeo" /f >/dev/null 2>&1 || true
          set +e
          timeout 900 "$exe" -s -nv > "$bundle/run-plain.txt" 2>&1
          code_plain=$?
          set -e
          cp "$map" "$bundle/batchsmith_tests.map"
          echo "普通跑（bash）：退出码 $code_plain"
          code_plain_py=$(runexe plain)
          cp "$RUNNER_TEMP/ps-plain.out.txt" "$bundle/run-plain-py.txt" 2>/dev/null || true
          echo "普通跑（python 取完整退出码）：$code_plain_py"

          mark "② 打开 PageHeap（IFEO 的 GlobalFlag，不需要 gflags.exe）"
          # ---------- ② 打开 PageHeap：靠 IFEO 的 GlobalFlag，不需要 gflags.exe ----------
          # （windows-latest 上没有 gflags.exe，它随 Debugging Tools for Windows 发布）
          reg add "$test_ifeo"  /v GlobalFlag    /t REG_DWORD /d 0x02000000 /f
          reg add "$test_ifeo"  /v PageHeapFlags /t REG_SZ    /d 0x3        /f
          reg add "$probe_ifeo" /v GlobalFlag    /t REG_DWORD /d 0x02000000 /f
          reg add "$probe_ifeo" /v PageHeapFlags /t REG_SZ    /d 0x3        /f
          reg add "$bs_ifeo"    /v GlobalFlag    /t REG_DWORD /d 0x02000000 /f
          reg add "$bs_ifeo"    /v PageHeapFlags /t REG_SZ    /d 0x3        /f
          reg query "$test_ifeo" || true

          mark "③ PageHeap 自检（越界探针）"
          # ---------- ③ 自检：故意越界 1 字节，开了全页堆就该在守卫页上当场 AV ----------
          probe="$RUNNER_TEMP/probe"
          mkdir -p "$probe"
          cat > "$probe/overflow.c" <<'PROBE_EOF'
          #include <stdio.h>
          #include <stdlib.h>

          int main(void) {
              char* p = (char*)malloc(16);
              if (p == NULL) {
                  return 2;
              }
              p[16] = 'X';
              printf("probe: 越界写没有触发异常\n");
              return 0;
          }
          PROBE_EOF
          set +e
          ( cd "$probe" && cl /nologo /Od /Fe:pageheap_probe.exe overflow.c ) > "$probe/cl.log" 2>&1
          cl_code=$?
          "$probe/pageheap_probe.exe" > "$probe/out.txt" 2>&1
          probe_code=$?
          set -e
          if [ "$cl_code" -ne 0 ]; then
            tail -10 "$probe/cl.log" | tr -d '\r' | while IFS= read -r l; do echo "::warning::$l"; done
          fi
          {
            echo "cl 退出码: $cl_code"
            echo "探针退出码: $probe_code （期望非 0；0xc0000005=3221225477 表示越界被守卫页抓住）"
            cat "$probe/out.txt"
          } > "$bundle/pageheap-selfcheck.txt"
          if [ "$probe_code" -eq 0 ]; then
            verdict="没起作用 ---- 探针越界写竟然正常返回 ⇒ PageHeap 是关着的，下面的结论一律不可信"
          else
            verdict="已生效 ---- 探针越界写被守卫页拦下（退出码 $probe_code）"
          fi
          echo "PageHeap 自检：$verdict"

          mark "④ PageHeap 下整跑"
          # ---------- ④ PageHeap 下再跑一遍（全页堆很慢，给足超时）----------
          set +e
          timeout 2400 "$exe" -s -nv > "$bundle/run-pageheap.txt" 2>&1
          code_heap=$?
          set -e
          echo "PageHeap 跑：退出码 $code_heap"
          mark "④b 嫌犯用例单跑（c55 / c56 / c57 / r55-57）"
          # ---------- ④b 关掉 PageHeap，再把嫌犯用例各自单独跑一个进程 ----------
          # 单跑的价值：整跑里「崩在 Y」只说明 Y 是受害者；**单跑还崩，它自己才是元凶**。
          # 关掉 PageHeap 是为了让这几次跑与 CI 红点同配置（全页堆换掉整个堆布局）。
          # 用例用序号选：中文用例名经 argv 传进去匹配不到（见 heapcheck 作业里的实测）。
          #
          #   55 区段里的语法错误被定位到具体区段
          #   56 区段只允许表达式：赋值语句编译不过
          #   57 沙箱中止会透出为求值失败      ← 两轮证据都指向这一个
          #   r55-57 三个连在一起跑 —— 用来区分「自己崩」与「被前面的用例带崩」
          reg delete "$test_ifeo" /f >/dev/null 2>&1 || true
          mapfile -t case_names < <("$exe" --list-test-cases | tr -d '\r' \
            | grep -v '^\[doctest\]' | grep -vE '^={10,}$')
          echo "用例总数: ${#case_names[@]}"
          case_report=()
          for tag in c55 c56 c57 r55-57; do
            line=$(runexe "$tag")
            cp "$RUNNER_TEMP/ps-$tag.out.txt" "$bundle/run-$tag.txt" 2>/dev/null || true
            echo "单跑 $tag：$line"
            case_report+=("$tag -> $line")
          done
          echo "--- 单跑用例名对照 ---"
          for idx in 55 56 57; do
            if [ "$idx" -le "${#case_names[@]}" ]; then
              echo "#$idx ${case_names[$((idx - 1))]}"
            fi
          done
          # ---------- /④b ----------
          mark "④c 用 CLI 复现（同一条中止路径，但没有 doctest；由 CLI 的 VEH 自报出错指令 RVA）"
          # ---------- ④c 用 CLI 复现 + 自报出错指令地址 ----------
          #
          # 为什么需要这一步（run #24 的实测）：PageHeap 下第 57 个用例**不再堆损坏**，
          # 而是当场 AV —— 但那一句是 doctest 打印的：
          #   `test_engine.cpp(184): FATAL ERROR: test case CRASHED: SIGSEGV`
          # 也就是说异常被 doctest 的未处理异常过滤器接住了 ⇒ 进不了 WER。
          #
          # ⚠️⚠️ **run #27 把"绕 WER"这条路彻底否掉了，别再往回走**：
          #   证据包里 `wer-application-error.xml` 与 `wer-wer.xml` 都是 **0 字节**，
          #   迷你转储也没生成 —— 说明 **GitHub runner 上 WER 根本不产事件**，
          #   LocalDumps 配了也白配。CLI 那次的输出文件同样是 0 字节
          #   （`QTextStream` 有内部缓冲，进程被异常终结时没人替它 flush）。
          #   而同一轮的 PageHeap 整跑给了一条反证：
          #   `[doctest] test cases: 57 | 56 passed | 1 failed | 98 skipped`
          #   ⇒ 这个 AV **是能被进程内处理器拿到的**。
          #
          # 所以改成：CLI 自己装一个 VEH（`BATCHSMITH_CRASH_REPORT=ON`，
          # 见 `src/cli/src/crash_report.cpp`），崩溃时直接打印**出错指令相对主模块基址的
          # RVA**、访问类型与出错地址，然后以退出码 **42** 立刻退出。
          # 有了这个 RVA，配 `bs.map` 就能翻成函数名 —— 不依赖 WER、不依赖转储、不依赖调试器。
          #
          # ⚠️ 模板里的 `$(…)` 必须用**单引号**包住，否则 bash 会当成命令替换去执行它。
          #
          # ⚠️ 产物一律**去找**，不假定落点：MSVC 的 `/MAP` 默认文件名取自输出文件，
          # 但目录并不保证与 exe 同处（`/OUT` 带路径时行为随版本变）——
          # 上一轮已经因为"假定某个目标/文件一定在"白扔过一轮，这里不再赌。
          bs_exe=$(find build/diag -name 'bs.exe' -type f -print -quit 2>/dev/null || true)
          if [ -n "$bs_exe" ]; then
            echo "找到 CLI：$bs_exe"

            # 仪器自检（**先验收仪器，再看它的结论**）：故意空指针写，逼出一个真异常。
            # 没有这一道，"没打出 VEH 那行"既可能是"没崩"，也可能是"仪器根本没装上"——
            # 这个项目已经在"仪器没生效"上白扔过好几轮。
            mark "④c-1 崩溃自报仪器自检（已知深度递归 + 空指针写，应打印模块名与 ≥3 帧调用链、退出码 42）"
            set +e
            BATCHSMITH_CRASH_SELFTEST=1 timeout 60 "$bs_exe" --version \
              > "$bundle/cli-crash-selftest.txt" 2>&1
            code_selftest=$?
            set -e
            head -60 "$bundle/cli-crash-selftest.txt" | tr -d '\r' || true
            # 自检要验三件事，缺一不可：① 仪器接住了异常（退出码 42 + 自报那行）；
            # ② **调用链真的走起来了**（run #28 之后补的 —— 当时的自检只验了 ①，
            # 而同一轮的真崩恰恰落在"只报主模块 RVA"这个盲区里，出错指令在别的模块）；
            # ③ **寄存器与被访问页的性质真的打出来了**（run #31 之后补的 —— 那一轮把崩点
            # 钉到了「QString 拷贝构造里对源对象的 d 做引用计数自增」，但"那个 d 指向的
            # 到底是已释放的堆还是从来没映射过的地址"只能靠寄存器 + VirtualQuery 分开，
            # 而当时这两样都不在报告里，只能靠猜）。缺了 ③，报告看起来照样"完整"。
            frames_selftest=$(grep -ac '^    #' "$bundle/cli-crash-selftest.txt" || true)
            regs_selftest=$(grep -ac '寄存器' "$bundle/cli-crash-selftest.txt" || true)
            if [ "$code_selftest" -ne 42 ] || ! grep -qa '崩溃自报' "$bundle/cli-crash-selftest.txt"; then
              echo "::error::崩溃自报仪器**没生效**（退出码 $code_selftest，应为 42）⇒ ④c 的结论不可信；本站作业的问题"
            elif [ "${frames_selftest:-0}" -lt 3 ]; then
              echo "::error::崩溃自报仪器只走出 ${frames_selftest:-0} 帧调用链（应 ≥ 3）⇒ 步行没工作，④c 的调用链不可信；本站作业的问题"
            elif [ "${regs_selftest:-0}" -lt 1 ] || ! grep -qa '指向 : ' "$bundle/cli-crash-selftest.txt"; then
              echo "::error::崩溃自报仪器没打出寄存器或嫌疑对象（连自检都没有这一块）⇒ ④c 的证据不完整，定不了「垃圾指针到底是什么」；本站作业的问题"
            else
              echo "仪器自检通过：VEH 已装上、模块名与 RVA 已算出、调用链 $frames_selftest 帧、寄存器与嫌疑对象已打出、退出码 42"
            fi

            set +e
            # `BATCHSMITH_MESSAGE_TRACE=1` 是**探针的开关**：编译期只决定"实现存不存在"，
            # 这里才决定"打不打印"。分开两个开关是为了让同一次诊断构建里的单元测试
            # 不被打扰（它们也会跑到中止路径，默认关着就安静）。
            BATCHSMITH_MESSAGE_TRACE=1 timeout 300 "$bs_exe" eval '$(function() while true do end end)()$' \
              --list list1=a,b > "$bundle/run-cli-abort.txt" 2>&1
            code_cli=$?
            set -e
            bs_map=$(find build/diag -name 'bs.map' -type f -print -quit 2>/dev/null || true)
            if [ -n "$bs_map" ]; then
              cp "$bs_map" "$bundle/bs.map"
              echo "找到符号表：$bs_map"
            else
              echo "::warning::没找到 bs.map（/MAP 可能没生效）—— 有 RVA 也没有函数名可翻"
            fi

            # ---------- 把**产物本身**也带回来 ----------
            #
            # 为什么：run #28 / #30 的实测是**出错指令不在 `bs.exe` 里**（`Qt6Core.dll + 0x10860`，
            # 两轮同一个 RVA）。而那份 .map 只覆盖 `bs.exe` 自己 ⇒ 外部模块的 RVA 拿什么也翻不了。
            # 把那个 DLL 带回来，就能用它的**导出表**把 RVA 折成 Qt 的函数名（本机没有 MSVC 版 Qt）。
            # `bs.exe` 也一起带上：调用点上真正 `call` 了谁，只有看它的反汇编才说得清。
            #
            # ⚠️ 产物一律**去找**，不假定落点（上一轮就因为"假定某文件一定在"白扔过一轮）。
            cp "$bs_exe" "$bundle/bs.exe" 2>/dev/null || echo "::warning::拷 bs.exe 进证据包失败"
            qt_core=""
            for cand in "${QT_ROOT_DIR:-}/bin/Qt6Core.dll" build/diag/bin/Qt6Core.dll; do
              if [ -n "$cand" ] && [ -f "$cand" ]; then qt_core="$cand"; break; fi
            done
            if [ -z "$qt_core" ]; then
              qt_core=$(find build/diag "${QT_ROOT_DIR:-/nonexistent}" -name 'Qt6Core.dll' \
                -type f -print -quit 2>/dev/null || true)
            fi
            if [ -n "$qt_core" ] && [ -f "$qt_core" ]; then
              cp "$qt_core" "$bundle/Qt6Core.dll" && echo "带上 Qt6Core.dll：$qt_core"
            else
              echo "::warning::没找到 Qt6Core.dll —— 出错模块只剩「模块名 + RVA」，翻不了函数名"
            fi
            # 自证（这一道是拿真金白银换来的）：这俩是本轮唯一的"位置"来源，缺一个就白跑一轮
            for f in bs.exe Qt6Core.dll; do
              if [ -s "$bundle/$f" ]; then
                echo "已入包：$f（$(stat -c%s "$bundle/$f") 字节）"
              else
                echo "::warning::证据包里没有 $f（缺失或 0 字节）⇒ 这一轮翻不了外部模块的函数名"
              fi
            done
            echo "CLI 中止路径（PageHeap 下）：退出码 $code_cli"
            # ⚠️ 退出码在这里是**残缺**的：bash 对无法映射到信号的 NTSTATUS 一律报 127，
            #    所以 127 既可能是"命令没找到"也可能是"0xC0000374"。判据改用**输出内容**：
            #    * 42  + `崩溃自报` 行 ⇒ 当场 AV，且拿到了「模块名 + RVA + 调用链」（这是要的东西）
            #    * `已中止：指令数超过上限` ⇒ 这一次没复现
            # ⚠️ run #28 的教训：那次出错指令落在**别的模块**里，而旧实现只对主模块算 RVA
            #    ⇒ 最有价值的一条信息只打出一个 0。所以这里不再"抽一行来看"，
            #    整段原文（含调用链）都打出来 —— 价值就在那几帧上。
            if grep -qa '崩溃自报' "$bundle/run-cli-abort.txt"; then
              echo "  → ✓ 当场 AV，VEH 已报出模块名 + RVA + 调用链（下面这段就是本轮的正主）"
            elif grep -qa '已中止' "$bundle/run-cli-abort.txt"; then
              echo "  → 正常走到了「已中止」这条路径（未触发 AV）⇒ 本探针这一次没抓住，看下一轮"
            else
              echo "  → 既没有「崩溃自报」也没有「已中止」⇒ 看下面这几行的原文"
            fi
            head -60 "$bundle/run-cli-abort.txt" | tr -d '\r' || true

            # 探针自证：本轮的全部价值就在这几行上 —— 它们把「消息的数据块从哪一步起
            # 变成不可访问的」切成若干段（注入列表之后 → raise 赋值之前 → raise 赋值之后 →
            # limit_hook 里 raise 返回之后 → 中止分支拷贝之前）。
            # 缺一行，二分的区间就断在那里；**一行都没有**更坏：探针在关掉时是空实现，
            # 日志看起来照样正常，于是"探针没说话"极易被误读成"消息一直是好的"。
            probes=$(grep -ac '^\[batchsmith\] 探针 ' "$bundle/run-cli-abort.txt" || true)
            if [ "${probes:-0}" -eq 0 ]; then
              echo "::error::④c 一行探针都没有 ⇒ BATCHSMITH_MESSAGE_TRACE 没生效（本站作业的问题），本轮定不了「哪一步丢的消息」"
            else
              echo "--- 探针（共 $probes 行，期望 ≥ 6 行）---"
              grep -a '^\[batchsmith\] 探针 ' "$bundle/run-cli-abort.txt" | tr -d '\r' || true
              if [ "$probes" -lt 6 ]; then
                echo "::warning::探针只打出 $probes 行（期望 ≥ 6）⇒ 二分的区间不完整：看它停在哪一步之前"
              fi
            fi
          else
            echo "::warning::bs.exe 没构建出来 —— ④c 跳过（这一步是拿「出错指令 RVA」的通道）"
          fi

          mark "⑤ WER 事件日志（⚠️ run #27 起已确认：runner 上它是空的，只作为存档）"
          # ---------- ⑤ WER 事件日志：用 XML，免得撞上控制台代码页 ----------
          #
          # ⚠️ **别再把结论寄托在这里**：run #27 的实测是两份 XML 都 **0 字节**、
          # 迷你转储也没生成 ⇒ **GitHub runner 上 WER 根本不产事件**（LocalDumps 白配）。
          # 保留这一步只是为了"万一哪天它有了"，以及留一份"当时确实没有"的存档。
          # 出错位置的正主是 ④c 的自报 RVA。
          #
          # 事件是异步写的，崩完不一定立刻可见 —— 轮询到出现为止
          for i in 1 2 3 4 5 6; do
            wevtutil qe Application /q:'*[System[Provider[@Name="Application Error"]]]' \
              /f:xml /c:5 /rd:true > "$bundle/wer-application-error.xml" 2>&1 || true
            wevtutil qe Application /q:'*[System[Provider[@Name="Windows Error Reporting"]]]' \
              /f:xml /c:5 /rd:true > "$bundle/wer-wer.xml" 2>&1 || true
            if grep -qa 'pageheap_probe\|batchsmith_tests\|bs\.exe' "$bundle/wer-application-error.xml"; then break; fi
            sleep 5
          done
          grep -ao 'bs\.exe\|batchsmith_tests\.exe\|pageheap_probe\.exe' "$bundle/wer-application-error.xml" | sort -u || true

          mark "⑥ 转储"
          # ---------- ⑥ 转储：只在体积可控时带上（推不上去等于没有）----------
          total=0
          for d in /c/diag-dumps/*.dmp; do
            [ -f "$d" ] || continue
            total=$((total + $(stat -c %s "$d")))
          done
          if [ "$total" -eq 0 ]; then
            # ⚠️ 0 字节 ≠ 超限。原先两件事共用一句话，会给出"超出 25MB 上限"这种假因果，
            #    让人去查体积，而真因是"根本没生成转储"（WER 没权限 / LocalDumps 没配 / 进程没真崩）。
            echo "未生成任何转储（合计 0 字节）—— 查 WER LocalDumps 是否生效、进程是否真的崩在托管路径上" \
              | tee "$bundle/dumps.txt"
          elif [ "$total" -le 25000000 ]; then
            for d in /c/diag-dumps/*.dmp; do
              [ -f "$d" ] || continue
              cp "$d" "$bundle/dump-$(basename "$d")"
            done
            echo "转储已带上，合计 $total 字节" | tee "$bundle/dumps.txt"
          else
            echo "转储合计 $total 字节 —— 超出 25MB 上限，本次不带；事件日志里已有出错模块与偏移" \
              | tee "$bundle/dumps.txt"
          fi

          mark "⑦ 摘要"
          # ---------- ⑦ 摘要：人类可读 + 一条注解 ----------
          {
            echo "== PageHeap 自检 =="
            echo "$verdict"
            echo
            echo "== 退出码对照（避免再把 127 读成「命令找不到」）=="
            echo "127 = 未映射的 NTSTATUS（0xC0000374 堆损坏 / 0xC00000FD 栈溢出）**或**命令找不到"
            echo "139 = SIGSEGV(0xC0000005)；132 = SIGILL(0xC000001D)；124 = timeout 超时"
            echo "（所以 bash 报 127 时要配 python 取到的完整退出码一起看，见下面几行）"
            echo
            echo "== 普通 Release 跑（与 CI 红点同配置）=="
            echo "退出码(bash): $code_plain ；退出码(python): $code_plain_py"
            echo "打出来的用例数: $(grep -ac '^TEST CASE:' "$bundle/run-plain.txt" 2>/dev/null || echo 0) 个（共 ${#case_names[@]} 个；下一个没打出的就是崩溃所在）"
            echo "最后 3 个用例:"
            grep -a '^TEST CASE:' "$bundle/run-plain.txt" 2>/dev/null | tail -3 | tr -d '\r' || true
            echo
            echo "== 嫌犯用例序号对照（--list-test-cases 的顺序，从 1 数起）=="
            for idx in 55 56 57; do
              if [ "$idx" -le "${#case_names[@]}" ]; then
                echo "#$idx ${case_names[$((idx - 1))]}"
              fi
            done
            echo
            echo "== 嫌犯单跑（Release，各自一个进程，PageHeap 已关）=="
            echo "（cases= 是本次真正打出来的用例数，应等于 1）"
            if [ "${#case_report[@]}" -gt 0 ]; then printf '%s\n' "${case_report[@]}"; fi
            echo
            echo "== PageHeap 跑 =="
            echo "退出码: $code_heap"
            echo "最后用例: $(last_case "$bundle/run-pageheap.txt")"
            grep -aE 'test cases:' "$bundle/run-pageheap.txt" | tail -1 || true
            echo "⚠️ 上面这行的第一个数字是「通过过滤器的用例数」，不是跑过的数量；"
            echo "   但**没有** --first/--last 时两者相等，所以它 < 总数就说明循环中途结束了。"
            echo
            echo "== 出错指令与调用链（④c：CLI 的 VEH 自报 —— **本轮的正主**）=="
            echo "仪器自检: 退出码 ${code_selftest:-未跑}（应为 42）、调用链 ${frames_selftest:-?} 帧（应 ≥ 3）、寄存器行 ${regs_selftest:-?} 条（应 ≥ 1）"
            head -60 "$bundle/cli-crash-selftest.txt" 2>/dev/null | tr -d '\r' || true
            echo "消息追踪探针: ${probes:-0} 行（期望 ≥ 6）"
            echo "CLI 中止路径（PageHeap）退出码: ${code_cli:-未跑}；产出见 run-cli-abort.txt"
            head -60 "$bundle/run-cli-abort.txt" 2>/dev/null | tr -d '\r' || true
            echo "→ 每行格式：[batchsmith] 探针 <时点> / <看的是谁>：数据=<指针>（页性质） 头部[ref/size/flags] HeapSize..."
            echo "  时点按时间顺序：注入列表之后 → raise 赋值之前(参数) → raise 赋值之后(参数/成员)"
            echo "                  → limit_hook：raise 返回之后(成员) → 中止分支：拷贝之前(成员)"
            echo "  判据（引用计数这一列是关键）："
            echo "    * raise 赋值之前 参数 ref=1，赋值之后 参数与成员 ref=2 且指针相同 ⇒ 引用计数算对了；"
            echo "      若赋值之后仍是 ref=1 ⇒ 「这次赋值没自增」，临时析构会把块减到 0 并释放 —— 凶手即此处。"
            echo "    * 页性质从「已提交/私有/读写」翻成「已保留/空闲」的那一步就是释放发生的区间；"
            echo "      ⚠️ 本机实测（.workbuddy/tools/pageprobe/）：「已保留」= 读写都当场 AV，"
            echo "      所以「已保留」与「成功读出内容」不可能同时为真 —— 一行里若两者并现，"
            echo "      说明那个「读出来的值」根本不是读出来的，别采信。"
            echo "    * 「HeapSize 在 N 个堆里都不认它」是与 VirtualQuery **独立**的第二条证据："
            echo "      两者都指向「已释放」才敢下结论；若二者打架，是我们对其中一个的理解错了。"
            echo "→ 出错位置写成了「模块名 + 0xRVA」，run #28 实测它**不一定是 bs.exe**。"
            echo "  属于 bs.exe 的帧配证据包里的 bs.map 翻函数名："
            echo "  .workbuddy/tools/ciwatch/symbolicate.py bs.map <RVA>"
            echo "  外部模块的 RVA（如 Qt6Core.dll）用**导出表**翻 —— 证据包里已带上那个 DLL："
            echo "  .workbuddy/tools/ciwatch/pe_rva.py Qt6Core.dll <RVA>"
            echo "  反汇编里 `call *0x...(%rip)` 命中的是哪个导入函数，用（objdump -p 的那列不是 IAT 槽，别对着行号数）："
            echo "  .workbuddy/tools/ciwatch/iat.py bs.exe <槽地址>"
            echo "→ 「被访问页 / 寄存器 / rcx、rdx 指向」这几样是 run #31 之后新加的：崩在外部模块里时，"
            echo "  光有调用链只能知道「是谁调进去的」，这三样才说明「它拿到的对象是什么鬼」；"
            echo "  `空闲` = 那片内存已归还系统（use-after-free 的铁证），"
            echo "  `已提交/私有` = 内存确实存在、只是不属于这个对象（说明对象本身被覆盖或从未初始化）。"
            echo "  验证工具（本机可跑）：.workbuddy/tools/ciwatch/{iat,pe_rva,symbolicate}.py 各自的 --selftest。"
            echo
            echo "== WER（存档；⚠️ runner 上它一直是空的，别再把结论寄托在这）=="
            echo "两个 XML 的字节数: $(wc -c < "$bundle/wer-application-error.xml" 2>/dev/null || echo '?') / $(wc -c < "$bundle/wer-wer.xml" 2>/dev/null || echo '?')"
            grep -ao 'bs\.exe\|batchsmith_tests\.exe\|pageheap_probe\.exe' "$bundle/wer-application-error.xml" | sort -u || true
            grep -ao 'Exception code: 0x[0-9a-fA-F]*\|Faulting module name: [^,<]*\|Fault offset: 0x[0-9a-fA-F]*' \
              "$bundle/wer-application-error.xml" 2>/dev/null | head -8 || true
            echo "（run #27 起已确认：这里空 **不代表**没崩 —— runner 上 WER 根本不产事件、"
            echo "  LocalDumps 也没转储；测试二进制那边则是被 doctest 的未处理异常过滤器接住了。"
            echo "  所以出错位置一律看上面 ④c 的 VEH 自报，WER 只当存档。）"
            echo
            echo "证据包: https://github.com/$GITHUB_REPOSITORY/releases/tag/ci-diag"
          } > "$bundle/summary.txt"
          cat "$bundle/summary.txt"
          ls -la "$bundle"
          tr -d '\r' < "$bundle/summary.txt" | sed -e 's/%/%25/g' \
            | awk '{printf "%s%%0A", $0}' > /tmp/summary.esc
          echo "::warning::Windows 内存证据包：$(cat /tmp/summary.esc)"

      - name: 上传证据包到预发布 ci-diag
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          bundle="$RUNNER_TEMP/diag"
          if [ ! -d "$bundle" ] || [ -z "$(ls -A "$bundle" 2>/dev/null)" ]; then
            echo "::warning::内存证据包：什么都没采集到，跳过上传（多半是配置/构建步就断了）"
            exit 0
          fi
          notes="CI 诊断证据包（自动生成，每次覆盖）。

          最新一次：run [#$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          提交：\`$GITHUB_SHA\`
          时间：$(date -u +%Y-%m-%dT%H:%M:%SZ)

          GitHub 的**制品（artifact）下载接口匿名读不到**，Release 附件可以 ——
          所以证据挂在这里。内容先看 \`summary.txt\`。"

          # 上传失败必须**自曝原因**：job 日志匿名读不到，注解是唯一能带出信息的通道。
          # 上一轮这一步只留下 "Process completed with exit code 1"，看不出是权限、
          # tag 冲突还是网络 —— 于是又得盲猜一轮。现在把 gh 的 stderr 原文提升成注解。
          #
          # ⚠️ 两个实测到的坑：
          #   ① **0 字节的附件会被拒**：`HTTP 400: Bad Content-Length`，而且会让**整条**
          #      `gh release upload a b c` 失败（其它文件也一起没上去）。所以要逐个传、
          #      并且跳过空文件（空文件的成因见 runexe.py —— 上一轮 PowerShell 那条路
          #      拿不到退出码，输出文件就是空的）。
          #   ② 失败了也**不判红**（`continue-on-error` 在作业级）：结论已由采集步那条
          #      注解带出，附件只是补充，不值得为它把整轮 CI 拖红。
          log=/tmp/gh-release.log
          : > "$log"
          rc=0
          if ! gh release view ci-diag >>"$log" 2>&1; then
            gh release create ci-diag --prerelease \
              --title "CI 诊断证据包（自动生成）" \
              --notes "$notes" >>"$log" 2>&1 || rc=$?
          fi

          files=()
          for f in "$bundle"/*; do
            [ -f "$f" ] || continue
            if [ -s "$f" ]; then
              files+=("$f")
            else
              echo "跳过 0 字节文件：$(basename "$f")"
            fi
          done
          uploaded=0
          for f in "${files[@]}"; do
            if gh release upload ci-diag "$f" --clobber >>"$log" 2>&1; then
              uploaded=$((uploaded + 1))
            else
              rc=1
            fi
          done

          if [ "$rc" -ne 0 ]; then
            {
              echo "上传失败，退出码 $rc（已成功 $uploaded / ${#files[@]} 个）"
              echo "--- gh 输出（末尾 25 行）---"
              tail -25 "$log" || true
              echo "--- gh auth status ---"
              gh auth status 2>&1 | head -12 || true
            } > /tmp/gh-report.txt
            tr -d '\r' < /tmp/gh-report.txt | sed -e 's/%/%25/g' \
              | awk '{printf "%s%%0A", $0}' > /tmp/gh-report.esc
            echo "::warning::内存证据包上传 Release 失败（附件没上全；结论已由采集步那条注解带出）：$(cat /tmp/gh-report.esc)"
            exit 0
          fi

          gh release edit ci-diag --notes "$notes" >>"$log" 2>&1 || true
          echo "::warning::内存证据包已更新（$uploaded 个附件）：https://github.com/$GITHUB_REPOSITORY/releases/tag/ci-diag"
          gh release view ci-diag --json assets --jq '.assets[] | "\(.name)\t\(.size)"' || true
          exit 0
          exit 0

  # =========================================================================
  # Windows 分配器审计（诊断）
  #
  # 要回答的问题：`0xC0000374` 是不是「分配器收到了脏入参」？
  #
  # 推理链（写在 src/core/src/sandbox/sandbox.cpp 的 AllocAudit 上）：
  #   ① 越界写这类原因**基本可以排除** —— 无论 ASan 插桩还是 Debug 的 CRT 调试堆，
  #      都会在事发时当场报出来，而两者在同一套 155 个用例上全绿；
  #   ② 剩下的高频嫌疑是 free / realloc 收到了**未知指针**或**大小不符**：
  #      这类调用在 ASan 的替换分配器下会被消化成正常调用，在 NT 堆的 LFH 上
  #      却直接判堆损坏、一句话都不说 —— 正好对上"只有 MSVC Release 红"。
  #   ③ 所以给沙箱的 Lua 分配器加逐块记账，违规时以**退出码 77** 停机并在
  #      stderr 写清是哪种违规（77 能穿过 bash 的退出码翻译，127 不能）。
  #
  # 抓不到也同样是结论：说明分配器入参自洽，可以把排查方向移开这一类。
  # 开关默认关（逐块记账很慢），只有本作业打开。
  # =========================================================================
  windows-alloc-audit:
    name: Windows 分配器审计
    runs-on: windows-latest
    # 与 windows-memdump 一致：本作业只为出结论，不该把整轮 CI 拖红
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          cache: true

      - name: 安装 Ninja
        shell: bash
        run: |
          python -m pip install --quiet ninja
          echo "$(python -c 'import ninja; print(ninja.BIN_DIR)')" >> "$GITHUB_PATH"

      - name: 准备 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置（Release + 分配器审计，不含界面）
        shell: bash
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: |
          set -uo pipefail
          if ! cmake --preset ci -DBATCHSMITH_ALLOC_AUDIT=ON -DBATCHSMITH_BUILD_GUI=OFF \
               > /tmp/cfg.log 2>&1; then
            tail -20 /tmp/cfg.log | tr -d '\r' | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::分配器审计作业：配置步失败（本站作业的问题，不是被测代码的问题）"
            exit 1
          fi
          # 仪器必须自证"真的开着" —— 否则"没抓到"这条结论一文不值
          if ! grep -q '分配器审计' /tmp/cfg.log; then
            echo "::error::配置摘要里没有「分配器审计」那一行 ⇒ 开关没生效，本轮结论不可信"
            exit 1
          fi
          grep '分配器审计' /tmp/cfg.log

      - name: 构建 core 测试
        shell: bash
        run: |
          if cmake --build --preset ci --target batchsmith_tests --parallel \
               > /tmp/build.log 2>&1; then
            tail -2 /tmp/build.log
          else
            grep -nE 'error [A-Z]+[0-9]+:|error:|fatal error' /tmp/build.log | head -10 \
              | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::分配器审计作业：构建步失败（本站作业的问题，不是被测代码的问题）"
            exit 1
          fi

      - name: 跑测试并读审计结论
        shell: bash
        run: |
          set -uo pipefail
          exe=./build/ci/bin/batchsmith_tests.exe
          out=/tmp/alloc.log
          : > "$out"
          set +e
          "$exe" -s -nv > "$out" 2>&1
          code=$?
          set -e
          cases=$(grep -ac '^TEST CASE:' "$out" || true)
          # 用例名在 --list-test-cases 里顶格输出（本机实测 155 行），
          # 首尾各有一行 [doctest] 与一条 ==== 分隔线，去掉它们再数
          total=$("$exe" --list-test-cases 2>/dev/null | tr -d '\r' \
            | grep -v '^\[doctest\]' | grep -vE '^={10,}$' | grep -c . || true)
          echo "退出码(bash): $code （127 = 未映射的 NTSTATUS 或命令找不到，两种都出现过）"
          echo "打出来的用例数: $cases / ${total:-?}"
          echo "--- [batchsmith] 输出（审计器的原话）---"
          grep -a '\[batchsmith\]' "$out" || echo "(没有 [batchsmith] 输出)"
          echo "--- 最后 3 个用例 ---"
          grep -a '^TEST CASE:' "$out" | tail -3 | tr -d '\r' || true
          echo "--- 末尾 15 行 ---"
          tail -15 "$out" | tr -d '\r' || true

          esc() { tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          if grep -qa '分配器审计失败' "$out"; then
            echo "::error::分配器审计**抓到违规** —— 这正是本轮要找的东西：$(grep -a -A3 '分配器审计失败' "$out" | head -8 | esc)"
          elif grep -qa '分配器审计警告' "$out"; then
            echo "::warning::分配器审计有告警（账本里还有未释放的块，非主线线索）：$(grep -a -A3 '分配器审计警告' "$out" | head -8 | esc)"
          else
            echo "::warning::分配器审计未触发 ⇒ 分配器拿到的指针与大小都是自洽的，这一类原因可以划掉；本次退出码 $code，用例数 $cases / ${total:-?}"
          fi

  # =========================================================================
  # 代码格式
  # =========================================================================
  format:
    name: 代码格式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 clang-format
        run: pip install 'clang-format==18.1.8'

      - name: 校验格式
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            -print0 | xargs -0 -r clang-format --dry-run --Werror
